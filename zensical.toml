# 搜尋：除了預設的半形空白與標點，再加入全形標點（，。、：；「」（）？！等）
# 與筆記中常見的符號（· … → ← ↑ ↓ ⇒ ✅ ❌ ⭐ 與框線字元）作為分詞邊界。
# 中文詞彙本身的切分由 theme.language = "zh-TW" 啟用瀏覽器內建的 Intl.Segmenter 處理。
[project.plugins.search]
separator = '[\s​\-_,:;!?=\[\]()"`/|]+|\.(?!\d)|[　-〿！-／：-＠［-｀｛-･·…←-⇿─-╿✅❌⭐]+'

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "zh-TW"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  "navigation.prune",
  # "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
  # "toc.integrate",
]

